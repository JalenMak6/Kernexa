name: Kernexa CI pipeline

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: jalenmakdocker/kernexa

concurrency:
  group: my-workflow
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # 1. BUILD
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Image
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      image_local_tag: ${{ steps.meta.outputs.image_local_tag }}

    steps:
      - name: Fix workspace permissions
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }} || true
          sudo find ${{ github.workspace }} -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate local image tag
        id: meta
        run: |
          SHA=$(echo $GITHUB_SHA | cut -c1-8)
          echo "image_local_tag=${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}-${SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ steps.meta.outputs.image_local_tag }} \
            --label "git.sha=${{ github.sha }}" \
            --label "git.branch=${{ github.ref_name }}" \
            --label "build.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

  # ────────────────────────────────────────────────────────────────────────────
  # 2. SCAN
  # CRITICAL → fail pipeline
  # HIGH     → reported only, non-blocking
  # ────────────────────────────────────────────────────────────────────────────
  scan:
    name: Trivy Security Scan
    runs-on: self-hosted
    needs: build
    timeout-minutes: 15

    steps:
      - name: Create .trivyignore
        run: |
          cat > .trivyignore << 'EOF'
          # jaraco.context vendored inside setuptools/_vendor - not independently installed
          # CVE applies to standalone package only, this is a false positive
          CVE-2026-23949

          # wheel vendored inside setuptools/_vendor - standalone wheel is patched
          # only the setuptools internal copy remains which cannot be upgraded
          CVE-2026-24049
          EOF

      - name: Run Trivy scan
        run: |
          # Scan for CRITICAL+HIGH so both appear in the report and email
          # --exit-code only triggers on CRITICAL (pipeline blocks on CRITICAL only)
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --format json \
            --output trivy-report.json \
            ${{ needs.build.outputs.image_local_tag }}

          # Now check specifically for CRITICAL to decide pass/fail
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --format table \
            ${{ needs.build.outputs.image_local_tag }}

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ github.ref_name }}-${{ github.run_number }}
          path: trivy-report.json
          retention-days: 30

      - name: Email scan result
        if: always()
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess

          notify_email      = os.environ['NOTIFY_EMAIL']
          notify_email_from = os.environ['NOTIFY_EMAIL_FROM']
          branch            = os.environ['BRANCH']
          run_number        = os.environ['RUN_NUMBER']
          sha               = os.environ['SHA'][:8]
          run_url           = os.environ['RUN_URL']

          try:
              data = json.load(open('trivy-report.json'))
          except Exception:
              data = {}

          findings = [
              v for r in data.get('Results', [])
              for v in (r.get('Vulnerabilities') or [])
              if v.get('Severity') in ('CRITICAL', 'HIGH')
          ]

          critical = sum(1 for v in findings if v.get('Severity') == 'CRITICAL')
          high     = sum(1 for v in findings if v.get('Severity') == 'HIGH')

          if critical == 0:
              status  = f"PASSED - No CRITICAL CVEs found ({high} HIGH found, non-blocking)"
              subject = f"Kernexa Trivy Scan Passed -- {branch} #{run_number}"
          else:
              status  = f"FAILED - {critical} CRITICAL CVEs found (pipeline blocked)"
              subject = f"Kernexa Trivy Scan Failed -- {branch} #{run_number}"

          lines = []
          lines.append("Kernexa Trivy Security Scan Result")
          lines.append("-" * 60)
          lines.append(f"Status:   {status}")
          lines.append(f"Branch:   {branch}")
          lines.append(f"Commit:   {sha}")
          lines.append(f"Run:      #{run_number}")
          lines.append("")
          lines.append("CVE Summary (unfixed excluded):")
          lines.append(f"  CRITICAL : {critical}  (blocks pipeline)")
          lines.append(f"  HIGH     : {high}      (reported only)")
          lines.append("")
          lines.append("-" * 60)
          lines.append("Full CVE Details:")
          lines.append("")

          if not findings:
              lines.append("No CRITICAL or HIGH CVEs found.")
          else:
              lines.append(f"Total: {len(findings)} findings")
              lines.append("=" * 60)
              for v in findings:
                  lines.append(f"CVE:      {v.get('VulnerabilityID', '')}")
                  lines.append(f"Severity: {v.get('Severity', '')}")
                  lines.append(f"Package:  {v.get('PkgName', '')} {v.get('InstalledVersion', '')}")
                  lines.append(f"Fixed in: {v.get('FixedVersion', '') or 'no fix available'}")
                  lines.append(f"Title:    {v.get('Title', '')}")
                  lines.append(f"URL:      {v.get('PrimaryURL', '')}")
                  lines.append("-" * 60)

          lines.append("")
          lines.append(f"Full report: {run_url}")
          lines.append("(Trivy report JSON attached as artifact - retention 30 days)")

          body = "\n".join(lines)
          email = f"To: {notify_email}\nFrom: {notify_email_from}\nSubject: {subject}\n\n{body}\n"

          proc = subprocess.run(['msmtp', notify_email], input=email, text=True)
          exit(proc.returncode)
          PYEOF

  # ────────────────────────────────────────────────────────────────────────────
  # 3. TEST  (dev branch only)
  # Spins up full stack, runs pytest against live container, then tears down
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Integration Test
    runs-on: self-hosted
    needs: [build, scan]
    if: github.ref_name == 'dev' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write test .env
        run: |
          cat > .env << EOF
          POSTGRES_DB=${{ secrets.DEV_POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.DEV_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.DEV_POSTGRES_PASSWORD }}
          NVD_API_KEY=${{ secrets.NVD_API_KEY }}
          CREDENTIALS_KEY=${{ secrets.DEV_CREDENTIALS_KEY }}
          APP_PORT=8000
          DB_PORT=5432
          ADMINER_PORT=8080
          IMAGE=${{ needs.build.outputs.image_local_tag }}
          ENABLE_DOCS=true
          EOF

      - name: Start containers
        run: docker compose up -d

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to be ready..."
          sleep 10
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8000/api/scans/latest || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
              echo "App is up (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i -- HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "App failed to start"
          docker compose logs app
          exit 1

      - name: Install test dependencies
        run: pip install -r requirements-test.txt --break-system-packages

      - name: Run pytest
        env:
          TEST_BASE_URL: http://localhost:8000
        run: |
          /home/jalen/.local/bin/pytest tests/test_api.py \
            --tb=short \
            --verbose \
            -p no:cacheprovider

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          rm -f .env


  # ────────────────────────────────────────────────────────────────────────────
  # 4. PUSH :latest  (dev branch only, after test passes)
  # ────────────────────────────────────────────────────────────────────────────
  push-dev:
    name: Push Dev Image
    runs-on: self-hosted
    needs: [build, scan, test]
    if: github.ref_name == 'dev' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Push :latest
        run: |
          docker tag ${{ needs.build.outputs.image_local_tag }} \
            ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "Pushed: ${{ env.IMAGE_NAME }}:latest"
          docker system prune -af

      - name: Email push notification
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          python3 << 'PYEOF'
          import os, subprocess

          notify_email      = os.environ['NOTIFY_EMAIL']
          notify_email_from = os.environ['NOTIFY_EMAIL_FROM']
          sha               = os.environ['SHA'][:8]
          run_number        = os.environ['RUN_NUMBER']
          run_url           = os.environ['RUN_URL']
          image_name        = os.environ['IMAGE_NAME']

          subject = f"Kernexa Dev Image Pushed -- latest"
          body = "\n".join([
              "Kernexa Dev Image Published",
              "-" * 60,
              f"Image:    {image_name}:latest",
              f"Branch:   dev",
              f"Commit:   {sha}",
              f"Run:      #{run_number}",
              "",
              "Pull command:",
              f"  docker pull {image_name}:latest",
              "",
              f"Run details: {run_url}",
          ])

          email = f"To: {notify_email}\nFrom: {notify_email_from}\nSubject: {subject}\n\n{body}\n"
          proc = subprocess.run(['msmtp', notify_email], input=email, text=True)
          exit(proc.returncode)
          PYEOF

      - name: Log out
        if: always()
        run: docker logout || true

  # ────────────────────────────────────────────────────────────────────────────
  # 5. PR CHECK  (PR to main only)
  # ────────────────────────────────────────────────────────────────────────────
  pr-check:
    name: PR Gate
    runs-on: self-hosted
    needs: [build, scan]
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: PR passed build and scan
        run: echo "Build and Trivy scan passed -- safe to merge"

  # ────────────────────────────────────────────────────────────────────────────
  # 6. PUSH :stable  (main branch only)
  # ────────────────────────────────────────────────────────────────────────────
  push-stable:
    name: Push Stable Image
    runs-on: self-hosted
    needs: [build, scan]
    if: github.ref_name == 'main' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Push :stable
        run: |
          docker tag ${{ needs.build.outputs.image_local_tag }} \
            ${{ env.IMAGE_NAME }}:stable
          docker push ${{ env.IMAGE_NAME }}:stable
          echo "Pushed: ${{ env.IMAGE_NAME }}:stable"
          docker system prune -af

      - name: Log out
        if: always()
        run: docker logout || true

  # ────────────────────────────────────────────────────────────────────────────
  # 7. PUSH :v*.*.* + :stable  (git tag only)
  # ────────────────────────────────────────────────────────────────────────────
  push-release:
    name: Push Release Image
    runs-on: self-hosted
    needs: [build, scan]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    steps:
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Push versioned tags
        run: |
          VERSION=${GITHUB_REF_NAME}
          docker tag ${{ needs.build.outputs.image_local_tag }} \
            ${{ env.IMAGE_NAME }}:${VERSION}
          docker push ${{ env.IMAGE_NAME }}:${VERSION}

          docker tag ${{ needs.build.outputs.image_local_tag }} \
            ${{ env.IMAGE_NAME }}:stable
          docker push ${{ env.IMAGE_NAME }}:stable

          echo "Pushed: ${{ env.IMAGE_NAME }}:${VERSION}"
          echo "Pushed: ${{ env.IMAGE_NAME }}:stable"
          docker system prune -af

      - name: Email release notification
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          python3 << 'PYEOF'
          import os, subprocess

          notify_email      = os.environ['NOTIFY_EMAIL']
          notify_email_from = os.environ['NOTIFY_EMAIL_FROM']
          version           = os.environ['VERSION']
          sha               = os.environ['SHA'][:8]
          run_number        = os.environ['RUN_NUMBER']
          run_url           = os.environ['RUN_URL']
          image_name        = os.environ['IMAGE_NAME']

          subject = f"Kernexa Release Image Pushed -- {version}"
          body = "\n".join([
              "Kernexa Release Image Published",
              "-" * 60,
              f"Version:  {version}",
              f"Image:    {image_name}:{version}",
              f"          {image_name}:stable",
              f"Commit:   {sha}",
              f"Run:      #{run_number}",
              "",
              "Pull commands:",
              f"  docker pull {image_name}:{version}",
              f"  docker pull {image_name}:stable",
              "",
              "Deploy to prod:",
              "  docker compose pull app",
              "  docker compose up -d --force-recreate app",
              "",
              f"Run details: {run_url}",
          ])

          email = f"To: {notify_email}\nFrom: {notify_email_from}\nSubject: {subject}\n\n{body}\n"
          proc = subprocess.run(['msmtp', notify_email], input=email, text=True)
          exit(proc.returncode)
          PYEOF

      - name: Log out
        if: always()
        run: docker logout || true

  # ────────────────────────────────────────────────────────────────────────────
  # 8. NOTIFY ON FAILURE  (main and tags only)
  # ────────────────────────────────────────────────────────────────────────────
  notify:
    name: Notify on Failure
    runs-on: self-hosted
    needs: [build, scan, push-stable, push-release]
    if: |
      failure() &&
      (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 5

    steps:
      - name: Send failure notification
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 << 'PYEOF'
          import os, subprocess

          notify_email      = os.environ['NOTIFY_EMAIL']
          notify_email_from = os.environ['NOTIFY_EMAIL_FROM']
          branch            = os.environ['BRANCH']
          run_number        = os.environ['RUN_NUMBER']
          run_url           = os.environ['RUN_URL']

          subject = f"Kernexa CI Failed -- {branch}"
          body = "\n".join([
              "Kernexa CI pipeline failed.",
              "-" * 60,
              f"Branch: {branch}",
              f"Run:    #{run_number}",
              "",
              f"{run_url}",
          ])

          email = f"To: {notify_email}\nFrom: {notify_email_from}\nSubject: {subject}\n\n{body}\n"
          proc = subprocess.run(['msmtp', notify_email], input=email, text=True)
          exit(proc.returncode)
          PYEOF
          docker system prune -af