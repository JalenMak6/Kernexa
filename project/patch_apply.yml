---
# =============================================================================
# Kernexa — Security Patch Applicator (Multi-OS)
#
# RHEL/Rocky/AlmaLinux:
#   Dry run:  yum update --security --advisory=<id> --assumeno
#   Apply:    yum update --security --advisory=<id> -y
#   Package names parsed directly from yum stdout — no extra queries.
#
# Ubuntu/Debian:
#   Dry run:  apt-get install --only-upgrade --dry-run <pkgs>
#   Apply:    apt-get install --only-upgrade -y <pkgs>
#
# Variables:
#   target_hosts  — group name from temp inventory
#   packages      — advisory ID (e.g. RHSA-2026:5080) or space-separated pkgs
#   advisory_id   — same as packages for advisory-based patching
#   dry_run       — true = simulate, false = apply
# =============================================================================

- name: Apply Security Patches
  hosts: "{{ target_hosts }}"
  gather_facts: true
  become: true
  become_method: sudo
  strategy: free
  vars:
    ansible_forks: 20
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  tasks:

    - name: Set OS family
      ansible.builtin.set_fact:
        _os_family: "{{ 'redhat' if ansible_facts.os_family == 'RedHat' else 'debian' if ansible_facts.os_family == 'Debian' else 'unknown' }}"
        _is_advisory: "{{ packages | regex_search('^(RHSA|ALSA|RLSA|RHBA|RHEA)-') is not none }}"

    - name: Abort on unsupported OS
      ansible.builtin.fail:
        msg: "Unsupported OS: {{ ansible_facts.os_family }}"
      when: _os_family == 'unknown'

    # ── RedHat — single yum call ──────────────────────────────────────────────

    - name: Run yum patch (RedHat — advisory dry run)
      ansible.builtin.shell: |
        yum update --security --advisory="{{ packages }}" --assumeno 2>&1 || true
      register: yum_output
      changed_when: false
      ignore_errors: true
      when: _os_family == 'redhat' and (_is_advisory | bool) and (dry_run | bool)

    - name: Run yum patch (RedHat — advisory apply)
      ansible.builtin.shell: |
        yum update --security --advisory="{{ packages }}" -y 2>&1
      register: yum_output
      changed_when: "'No packages marked for update' not in yum_output.stdout"
      ignore_errors: true
      when: _os_family == 'redhat' and (_is_advisory | bool) and not (dry_run | bool)

    - name: Run yum patch (RedHat — package dry run)
      ansible.builtin.shell: |
        yum update {{ packages }} --assumeno 2>&1 || true
      register: yum_output
      changed_when: false
      ignore_errors: true
      when: _os_family == 'redhat' and not (_is_advisory | bool) and (dry_run | bool)

    - name: Run yum patch (RedHat — package apply)
      ansible.builtin.shell: |
        yum update {{ packages }} -y 2>&1
      register: yum_output
      changed_when: "'No packages marked for update' not in yum_output.stdout"
      ignore_errors: true
      when: _os_family == 'redhat' and not (_is_advisory | bool) and not (dry_run | bool)

    # ── Debian — single apt call ──────────────────────────────────────────────

    - name: Update apt cache (Debian)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      ignore_errors: true
      when: _os_family == 'debian'

    - name: Run apt patch (Debian — dry run)
      ansible.builtin.shell: |
        apt-get install --only-upgrade --dry-run {{ packages }} 2>&1 || true
      register: apt_output
      changed_when: false
      ignore_errors: true
      when: _os_family == 'debian' and (dry_run | bool)

    - name: Run apt patch (Debian — apply)
      ansible.builtin.shell: |
        apt-get install --only-upgrade -y {{ packages }} 2>&1
      register: apt_output
      changed_when: "'0 upgraded' not in apt_output.stdout"
      ignore_errors: true
      when: _os_family == 'debian' and not (dry_run | bool)

    # ── Consolidate and emit ───────────────────────────────────────────────────

    - name: Consolidate output
      ansible.builtin.set_fact:
        _stdout:  "{{ (yum_output.stdout if _os_family == 'redhat' else apt_output.stdout) | default('') }}"
        _changed: "{{ (yum_output.changed if _os_family == 'redhat' else apt_output.changed) | default(false) }}"
        _rc:      "{{ (yum_output.rc if _os_family == 'redhat' else apt_output.rc) | default(0) }}"

    - name: Print patch results
      ansible.builtin.debug:
        msg:
          hostname:    "{{ inventory_hostname }}"
          os_family:   "{{ _os_family }}"
          advisory_id: "{{ advisory_id | default('') }}"
          dry_run:     "{{ dry_run | bool }}"
          changed:     "{{ _changed | bool }}"
          stdout:      "{{ _stdout }}"
          rc:          "{{ _rc }}"
          failed:      false